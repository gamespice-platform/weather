[plugin]

name="gs-weather"
description="Everyday weather as a per-map document: snow, rain, fog, wind and thunderstorms. Lightning and thunder come from a seeded schedule of the shared match time, so every client agrees without a packet. Requires gs-core; gs-fx draws the precipitation and gs-lighting writes the fog when they are installed."
author="dot"
version="0.1.0"
script="gs_weather_plugin.gd"
